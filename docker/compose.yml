# AiXin one-click stack — app + Postgres/Supabase + local LLM + reverse proxy
# Usage:
#   cp docker/.env.example docker/.env   (edit values)
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
#
# Profiles:
#   default          -> app + db + proxy
#   --profile llm    -> adds Ollama (local model, nothing leaves your network)
#   --profile supabase -> adds GoTrue auth + PostgREST for a fully local data plane

name: aixin

services:
  db:
    image: ${SUPABASE_POSTGRES_IMAGE:-supabase/postgres:15.8.1.060}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aixin}
    volumes:
      - db-data:/var/lib/postgresql/data
      # NOTE: supabase/migrations is deliberately NOT mounted into
      # /docker-entrypoint-initdb.d — the schema references auth.users, which only
      # exists after GoTrue has run its own migrations. scripts/aixin-up.sh applies
      # the SQL in order once auth is ready.

    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-aixin}"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.177.0
    profiles: ["supabase"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aixin}?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      API_EXTERNAL_URL: ${PUBLIC_SITE_URL:-http://localhost}
    ports:
      - "9999:9999"

  rest:
    image: postgrest/postgrest:v12.2.3
    profiles: ["supabase"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aixin}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Data plane (names must match what the app reads)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # LLM (Ollama, Qwen/DashScope, DeepSeek — any OpenAI-compatible base URL)
      AIXIN_LLM_BASE_URL: ${AIXIN_LLM_BASE_URL:-http://ollama:11434/v1}
      AIXIN_LLM_API_KEY: ${AIXIN_LLM_API_KEY:-ollama}
      AIXIN_LLM_MODEL: ${AIXIN_LLM_MODEL:-qwen2.5:7b-instruct}
      # Receipt signing (Ed25519 seed, hex)
      AIXIN_SIGNING_SEED: ${AIXIN_SIGNING_SEED:-}
      # Governance / anchoring (BSC Testnet)
      BSC_TESTNET_RPC_URL: ${BSC_TESTNET_RPC_URL:-}
      BSC_TESTNET_PRIVATE_KEY: ${BSC_TESTNET_PRIVATE_KEY:-}
      AUDIT_ANCHOR_CONTRACT_ADDRESS: ${AUDIT_ANCHOR_CONTRACT_ADDRESS:-}
      ERC8004_IDENTITY_ADDRESS: ${ERC8004_IDENTITY_ADDRESS:-}
      ERC8004_REPUTATION_ADDRESS: ${ERC8004_REPUTATION_ADDRESS:-}
      ERC8004_VALIDATION_ADDRESS: ${ERC8004_VALIDATION_ADDRESS:-}
      AIXIN_VALIDATOR_URL: ${AIXIN_VALIDATOR_URL:-}
      # Optional adapters (Gmail needs no env: credentials live per user in the DB)
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}

    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

volumes:
  db-data:
  ollama-data:
  caddy-data:
  caddy-config:
